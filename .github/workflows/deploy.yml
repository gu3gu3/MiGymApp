name: Deploy MiGymApp to production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci:
    name: Build and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Generate Prisma client
        run: npx prisma generate

  deploy:
    name: Deploy to production
    needs: ci
    runs-on: self-hosted
    environment: production
    steps:
      - name: Run production deploy script
        run: sudo /opt/migymapp/deploy.sh
